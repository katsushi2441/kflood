<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site }}{% endblock %}</title>
<meta name="description" content="{% block desc %}住所を入れると、洪水（河川の氾濫）と内水（下水道・水路からの浸水）で何メートル・何日浸かる想定かを、データ時点つきで返します。{% endblock %}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.desc() }}">
<meta property="og:type" content="website">
<meta property="og:image" content="https://kurage.exbridge.jp/images/ogp/kflood.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--teal:#0a9a8f;--teal-d:#087f76;--teal-l:#e6f4f2;--navy:#12202f;--ink:#1f2933;--muted:#5d6b7a;--line:#dfe6ea;--bg:#f6f9f9;--red:#c0392b;--red-l:#fbeae8;--amber:#b7791f;--amber-l:#fdf3e0;--blue:#1f5f8b;--blue-l:#e8f1f8}
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.75;font-size:16px}
a{color:var(--teal-d)}.wrap{max-width:980px;margin:0 auto;padding:0 16px;min-width:0}
header.top{background:#fff;border-bottom:1px solid var(--line)}header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;flex-wrap:wrap}
.brand{font-weight:800;color:var(--navy);text-decoration:none;font-size:17px}.brand small{color:var(--teal);font-weight:700;margin-left:6px;font-size:12px}
nav.menu a{color:var(--muted);text-decoration:none;font-size:14px;margin-left:14px;font-weight:600}nav.menu a.on{color:var(--teal-d)}
main{padding:22px 0 40px}h1{font-size:clamp(22px,4vw,30px);line-height:1.35;color:var(--navy);margin:0 0 8px}h2{font-size:19px;color:var(--navy);margin:26px 0 10px;border-left:5px solid var(--teal);padding-left:10px}
.lead{color:var(--muted);margin:0 0 16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0;min-width:0}
form.search{display:flex;gap:8px;flex-wrap:wrap}form.search input[type=text]{flex:1 1 260px;min-width:0;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:10px}
form.search input[type=text]:focus{outline:none;border-color:var(--teal)}
.btn{display:inline-block;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}.btn:hover{background:var(--teal-d)}
.btn.ghost{background:#fff;color:var(--teal-d);border:2px solid var(--teal)}.btn.sm{padding:8px 14px;font-size:14px}
.ex{font-size:13px;color:var(--muted);margin-top:8px}.ex a{margin-right:10px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;min-width:0}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;min-width:0}.card .k{font-size:12.5px;color:var(--muted);font-weight:700}.card .v{font-size:22px;font-weight:800;color:var(--navy);line-height:1.3;overflow-wrap:anywhere}.card .s{font-size:13px;color:var(--muted);margin-top:4px}
.card.lv1{background:var(--blue-l)}.card.lv2{background:var(--amber-l)}.card.lv3{background:var(--red-l)}.card.lv3 .v{color:var(--red)}.card.none{background:var(--teal-l)}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--teal-l);color:var(--teal-d);margin-right:6px}
.badge.red{background:var(--red-l);color:var(--red)}.badge.amber{background:var(--amber-l);color:var(--amber)}.badge.gray{background:#eef1f3;color:var(--muted)}
ul.guide{padding-left:0;list-style:none;margin:8px 0}ul.guide li{padding:10px 12px 10px 40px;position:relative;border-bottom:1px solid var(--line)}ul.guide li:before{content:"→";position:absolute;left:12px;color:var(--teal);font-weight:800}
.note{background:var(--amber-l);border-left:4px solid var(--amber);padding:10px 12px;border-radius:8px;font-size:14px;margin:8px 0}
.src{font-size:12.5px;color:var(--muted)}.src li{margin:2px 0}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}table.t th{color:var(--muted);font-weight:700;white-space:nowrap}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.err{background:var(--red-l);color:var(--red);padding:12px;border-radius:10px;font-weight:700}
footer{border-top:1px solid var(--line);background:#fff;padding:20px 0;color:var(--muted);font-size:13px}footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}.step{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}.step b{display:block;color:var(--teal-d);font-size:13px}.step strong{display:block;font-size:16px;color:var(--navy);margin:4px 0}
@media print{header.top,footer,.noprint{display:none!important}body{background:#fff}.panel{border:0;padding:0}}
{% block css %}{% endblock %}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<a class="brand" href="./">{{ site }}<small>{% block badge %}名古屋市版デモ{% endblock %}</small></a>
<nav class="menu"><a href="./" class="{{ 'on' if nav=='home' }}">住所で判定</a><a href="timeline" class="{{ 'on' if nav=='timeline' }}">マイ・タイムライン</a><a href="batch" class="{{ 'on' if nav=='batch' }}">CSV一括</a><a href="about" class="{{ 'on' if nav=='about' }}">データについて</a></nav>
</div></header>
<main><div class="wrap">
{% block body %}{% endblock %}
</div></main>
<footer><div class="wrap">
<div>判定は公開データを住所の代表点で照らした参考情報です。公的な証明ではありません。出典: 国土数値情報（国土交通省）／名古屋市（CC BY 4.0）を加工。</div>
<div>関連: <a href="{{ links.khazard }}">土砂災害</a>・<a href="{{ links.ktsunami }}">津波</a>・<a href="https://kappstore.exbridge.jp/app.php?id=162f155897390072&ref=kflood">避難所マップ</a>・<a href="https://exbridge.jp/solution/seito.html">政党・議員事務所向け</a></div>
</div></footer>
{% block js %}{% endblock %}
</body>
</html>
