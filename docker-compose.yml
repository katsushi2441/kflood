# kflood のデータ基盤。土砂(khazard)・商圏(kshoken)とは別のDBにして、製品の境界を分ける。
# 全国分は数十GBになるので、データの実体は KFLOOD_PG_DIR で別ディスクに置ける（既定は ./data/pg）。
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: kflood-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kflood
      POSTGRES_PASSWORD: ${KFLOOD_DB_PASS:-kflood_local}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${KFLOOD_DB_PORT:-55434}:5432"
    volumes:
      - ${KFLOOD_PG_DIR:-./data/pg}:/var/lib/postgresql/data
    shm_size: 1g
